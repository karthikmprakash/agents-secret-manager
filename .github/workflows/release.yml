name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/sm-darwin-$arch" ./cmd/sm
            (cd dist && shasum -a 256 "sm-darwin-$arch" > "sm-darwin-$arch.sha256")
          done
      - name: Build universal macOS app bundle
        run: |
          set -euo pipefail
          UNIVERSAL=1 ./scripts/build-mac-app.sh
          lipo -create dist/sm-darwin-arm64 dist/sm-darwin-amd64 -output dist/sm-universal
          rm -rf dist/macos-zip && mkdir dist/macos-zip
          cp -R dist/sm.app dist/macos-zip/
          cp dist/sm-universal dist/macos-zip/sm
          (cd dist/macos-zip && zip -qry ../sm-macos-app.zip sm.app sm)
          (cd dist && shasum -a 256 sm-macos-app.zip > sm-macos-app.zip.sha256)
          rm -rf dist/macos-zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/sm-darwin-*
            dist/sm-macos-app.zip*
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-linux-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/sm-linux-amd64
            dist/sm-desktop-linux-amd64
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
